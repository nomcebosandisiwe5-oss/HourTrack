<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password</title>
<style>
  body { 
    background: #d7c4b0; 
    display: flex; justify-content: center; align-items: center; 
    height: 100vh; margin: 0; font-family: 'Segoe UI', Arial, sans-serif;
  }
  .container {
    background: #c9b090; 
    padding: 20px; 
    border-radius: 24px;
    width: 90%; max-width: 380px;
    border: 2px solid #8d6e53;
  }
  .card {
    background: #f8fbff;
    border-radius: 20px;
    padding: 25px 25px 30px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  }
  h2 { text-align: center; color: #6f543f; font-weight: 500; margin: 0 0 15px; }
  .icon-wrap { display: flex; justify-content: center; margin-bottom: 25px; }
  .icon svg { width: 50px; height: 50px; stroke: #8d6e53; }
  label { color: #5c4033; font-weight: 600; font-size: 18px; display: block; margin-bottom: 8px; }
  .input-box { position: relative; margin-bottom: 18px; }
  input {
    width: 100%; box-sizing: border-box;
    padding: 12px 15px;
    border-radius: 10px; border: 1px solid #e1e8f0;
    background: #f1f5f9; outline: none; font-size: 15px;
  }
  input:focus { border-color: #3b82f6; background: white; }
  button {
    width: 100%; padding: 13px;
    background:  #8d6e53; color: white; border: none;
    border-radius: 10px; font-size: 18px; font-weight: 600;
    cursor: pointer; margin-top: 10px;
  }
  button:hover { background: #6f543f; }
  .msg { 
    text-align: center; font-size: 13px; 
    margin-bottom: 15px; padding: 12px; border-radius: 8px;
  }
  .msg-success { color: #166534; background: #dcfce7; }
  .msg-error   { color: #991b1b; background: #fee2e2; }
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2>Reset Password</h2>
    <div class="icon-wrap">
      <div class="icon">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
        </svg>
      </div>
    </div>

    {% if message %}
      <div class="msg {% if success %}msg-success{% else %}msg-error{% endif %}">
        {{ message }}
      </div>
    {% endif %}

    {% if valid %}
      <form method="POST" action="/reset-password/{{ token }}">
        <label>New Password</label>
        <div class="input-box">
          <input type="password" name="password" placeholder="••••••••" required minlength="6">
        </div>

        <label>Confirm New Password</label>
        <div class="input-box">
          <input type="password" name="confirm_password" placeholder="••••••••" required minlength="6">
        </div>

        <button type="submit">Reset Password</button>
      </form>
    {% endif %}

    <p style="margin-top:15px; text-align:center; font-size:14px;">
      <a href="/login" style="color:#7F5539; font-weight:bold; text-decoration:none;">← Back to Login</a>
    </p>
  </div>
</div>

</body>
</html>
